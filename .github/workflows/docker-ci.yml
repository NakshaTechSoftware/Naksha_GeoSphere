name: docker-ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create a throwaway .env for config validation
        run: cp .env.example .env

      - name: Validate dev overlay
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet

      - name: Validate prod overlay
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

  build-images:
    name: Build ${{ matrix.service }} image (runner target)
    runs-on: ubuntu-latest
    needs: validate-compose
    strategy:
      matrix:
        include:
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
          - service: api
            context: services/api
            dockerfile: services/api/Dockerfile
          - service: worker
            context: services/worker
            dockerfile: services/worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — this workflow intentionally never pushes an image.
      - name: Build ${{ matrix.service }} (runner target)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runner
          push: false
          tags: naksha-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
