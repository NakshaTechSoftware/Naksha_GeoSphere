# Naksha GeoAI Agent Service — joins the main GeoSphere stack's network.
#
# Run the main stack first (from the repo root):
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# Then, from this directory:
#   docker compose up --build -d
#
# This reuses the existing Redis and network from the main stack,
# exactly like the GeoAI Tool Adapter Service does.

networks:
  naksha-network:
    external: true
    name: naksha-network

volumes:
  ollama-data:

services:
  ai-agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AGENT_HOST_PORT:-8200}:8000"
    networks:
      - naksha-network
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Local LLM server (Ollama) — only needed when LLM_PROVIDER=ollama.
  # For OpenAI-only deployments, comment out or remove this service.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - naksha-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
