# Naksha GeoSphere — development overlay.
# Hot reload, source bind-mounts, and host ports for every service.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build -d

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  minio:
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:v1.21.5
    restart: unless-stopped
    networks:
      - naksha-network
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Turn-by-turn directions (Karnataka only) - see infrastructure/routing/. One service per
  # travel mode - OSRM serves exactly one profile per running instance, so driving/walking/
  # cycling each need their own prebuilt dataset (see build.sh) and their own osrm-routed
  # process, not just a config flag on a shared one. Dev-only for now (no separate app-compute
  # server exists yet to run this in production - see infrastructure/routing/README.md). Data
  # is prebuilt offline via build.sh, not at container start, so these come up in seconds.
  osrm-driving:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/karnataka-latest.osrm
    networks:
      - naksha-network
    ports:
      - "${OSRM_DRIVING_HOST_PORT:-5001}:5000"
    volumes:
      - ./infrastructure/routing/data/driving:/data:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/route/v1/driving/77.59,12.97;77.60,12.98"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  osrm-walking:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/karnataka-latest.osrm
    networks:
      - naksha-network
    ports:
      - "${OSRM_WALKING_HOST_PORT:-5002}:5000"
    volumes:
      - ./infrastructure/routing/data/walking:/data:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/route/v1/walking/77.59,12.97;77.60,12.98"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  osrm-cycling:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/karnataka-latest.osrm
    networks:
      - naksha-network
    ports:
      - "${OSRM_CYCLING_HOST_PORT:-5003}:5000"
    volumes:
      - ./infrastructure/routing/data/cycling:/data:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/route/v1/cycling/77.59,12.97;77.60,12.98"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      target: dev
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./services/api/app:/app/app
      - ./services/api/migrations:/app/migrations
      - ./services/api/tests:/app/tests
      - ./services/api/alembic.ini:/app/alembic.ini
      - ./services/api/pyproject.toml:/app/pyproject.toml

  worker:
    build:
      target: dev
    volumes:
      - ./services/worker/worker:/app/worker
      - ./services/worker/tests:/app/tests
      - ./services/worker/pyproject.toml:/app/pyproject.toml

  web:
    build:
      target: dev
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Naksha GeoSphere}
      WATCHPACK_POLLING: "true"
      INDIA_DEM_PATH: /app/DEM_Terrain/India_DEM.tif
      INDIA_DEM_OVERVIEW_PATH: /app/DEM_Terrain/India_DEM_overview.tif
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./DEM_Terrain:/app/DEM_Terrain:ro
