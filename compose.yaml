# Naksha GeoSphere — shared Docker Compose service definitions.
#
# This file alone is never run directly. Combine it with an environment
# overlay:
#   docker compose -f compose.yaml -f compose.dev.yaml  up --build -d
#   docker compose -f compose.yaml -f compose.prod.yaml up --build -d
#
# No image below uses an unpinned "latest" tag, and no credential has a
# hardcoded fallback — required secrets use `${VAR:?err}` so Compose
# refuses to start rather than run with an empty/default value.

networks:
  naksha-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naksha_geosphere}
      POSTGRES_USER: ${POSTGRES_USER:-naksha_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - naksha-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naksha_app} -d ${POSTGRES_DB:-naksha_geosphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    networks:
      - naksha-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    volumes:
      - minio-data:/data
    networks:
      - naksha-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      S3_BUCKET_SOURCE_DATA: ${S3_BUCKET_SOURCE_DATA:-geosphere-source-data}
      S3_BUCKET_PREVIEW_DATA: ${S3_BUCKET_PREVIEW_DATA:-geosphere-preview-data}
      S3_BUCKET_ORDER_OUTPUT: ${S3_BUCKET_ORDER_OUTPUT:-geosphere-order-output}
      S3_BUCKET_TEMPORARY_DATA: ${S3_BUCKET_TEMPORARY_DATA:-geosphere-temporary-data}
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    volumes:
      - ./infrastructure/docker/minio-init/create-buckets.sh:/init/create-buckets.sh:ro
    networks:
      - naksha-network
    restart: "no"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - naksha-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status == 200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - naksha-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.main inspect ping -d \"celery@$$(hostname)\" --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Naksha GeoSphere}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INDIA_DEM_PATH=/app/DEM_Terrain/India_DEM.tif
      - INDIA_DEM_OVERVIEW_PATH=/app/DEM_Terrain/India_DEM_overview.tif
    volumes:
      - ./DEM_Terrain:/app/DEM_Terrain:ro
    depends_on:
      - api
    networks:
      - naksha-network
