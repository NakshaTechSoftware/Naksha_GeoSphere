services:
  naksha_frontend:
    container_name: naksha_frontend
    image: naksha_frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=Naksha GeoSphere
    restart: unless-stopped
